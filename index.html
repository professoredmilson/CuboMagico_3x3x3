<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cubo Mágico 3x3</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
    }
    
    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.3rem;
      gap: 0.5rem;
    }
    
    .cabecalho {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }
    
    .cabecalho img {
      width: 32vmin;
      max-width: 180px;
      height: auto;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
    }
    
    .cube-area {
      width: 78vmin;
      height: 78vmin;
      max-width: 78vh;
      max-height: 78vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    
    #animcube {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .botoes {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    
    .btn-acao {
      padding: 0.55rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 50px;
      border: none;
      color: #fff;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn-embaralhar {
      background: #238636;
    }
    
    .btn-embaralhar:hover {
      background: #2ea043;
      transform: scale(1.04);
      color: #fff;
    }
    
    .btn-creditos {
      padding: 0.4rem 0.9rem;
      font-size: 0.8rem;
      background: #30363d;
      border: 1px solid #484f58;
      color: #c9d1d9;
    }
    
    .btn-justificativa {
      background: #6f42c1;
    }
    
    .btn-justificativa:hover {
      background: #8250df;
      transform: scale(1.04);
      color: #fff;
    }
    
    .btn-acao:active {
      transform: scale(0.97);
    }
    
    /* Celebração */
    .celebracao {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
    }
    
    .celebracao.ativo {
      opacity: 1;
      visibility: visible;
    }
    
    .celebracao-conteudo {
      text-align: center;
      animation: popIn 0.55s ease;
    }
    
    .celebracao h1 {
      font-size: 2.9rem;
      font-weight: 800;
      color: #ffd700;
      text-shadow: 0 0 22px rgba(255, 215, 0, 0.55);
      margin-bottom: 0.4rem;
    }
    
    .celebracao p {
      font-size: 1.2rem;
      margin-bottom: 1.4rem;
    }
    
    .btn-fechar {
      padding: 0.7rem 1.8rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 50px;
      background: #238636;
      border: none;
      color: #fff;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    
    .confete {
      position: absolute;
      border-radius: 2px;
      animation: cair 3s linear forwards;
    }
    
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    @keyframes cair {
      0% {
        transform: translateY(-15vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(720deg);
        opacity: 0;
      }
    }
    
    /* Modal Créditos */
    .modal-creditos {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    
    .modal-creditos.ativo {
      opacity: 1;
      visibility: visible;
    }
    
    .modal-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 1.6rem 1.9rem;
      max-width: 320px;
      text-align: center;
      position: relative;
      z-index: 10001;
    }
    
    .modal-box p {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.3rem;
    }
    
    .cube {
      display: inline-block !important;
    }
  </style>
</head>
<body>
  <div class="app">
    
    <!-- Cabeçalho com a imagem (≈ 1/3 do cubo) -->
    <div class="cabecalho">
      <img src="logo.png" alt="GET Olimpíadas Rio 2016">
    </div>
    
    <div class="cube-area">
      <div id="animcube"></div>
    </div>
    
    <div class="botoes">
      <button class="btn btn-acao btn-embaralhar" onclick="embaralhar()">Embaralhar</button>
      <a href="justificativa.html" class="btn btn-acao btn-justificativa">Justificativa Pedagógica</a>
      <button class="btn btn-acao btn-creditos" onclick="abrirCreditos()">Créditos</button>
    </div>
    
  </div>

  <!-- Celebração -->
  <div class="celebracao" id="celebracao">
    <div class="celebracao-conteudo">
      <h1>🎉 Parabéns! 🎉</h1>
      <p>Você completou o Cubo Mágico 3x3!</p>
      <button class="btn-fechar" id="btnFecharCelebracao">Continuar</button>
    </div>
  </div>

  <!-- Créditos -->
  <div class="modal-creditos" id="modalCreditos">
    <div class="modal-box">
      <p>Feito pelo professor Edmilson Souza, PA do GET Olimpíadas Rio 2016</p>
      <button class="btn-fechar" id="btnFecharCreditos">Fechar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://animcubejs.cubing.net/AnimCube3.js"></script>
  
  <script>
    function iniciarCubo(params = "buttonbar=1&bgcolor=0d1117&butbgcolor=21262d&fonttype=0&scale=5&snap=1") {
      const container = document.getElementById("animcube");
      container.innerHTML = "";
      
      const script = document.createElement("script");
      script.textContent = `AnimCube3("id=animcube&${params}")`;
      container.appendChild(script);
    }
    
    function embaralhar() {
      iniciarCubo("initmove=random&buttonbar=1&bgcolor=0d1117&butbgcolor=21262d&fonttype=0&scale=5&snap=1&randmoves=25");
    }
    
    function abrirCreditos() {
      document.getElementById("modalCreditos").classList.add("ativo");
    }
    
    function fecharCreditos() {
      document.getElementById("modalCreditos").classList.remove("ativo");
    }
    
    function fecharCelebracao() {
      document.getElementById("celebracao").classList.remove("ativo");
      document.querySelectorAll(".confete").forEach(el => el.remove());
    }
    
    document.addEventListener("DOMContentLoaded", function() {
      iniciarCubo();
      
      const btnCreditos = document.getElementById("btnFecharCreditos");
      btnCreditos.addEventListener("click", fecharCreditos);
      btnCreditos.addEventListener("touchend", function(e) {
        e.preventDefault();
        fecharCreditos();
      });
      
      const btnCeleb = document.getElementById("btnFecharCelebracao");
      btnCeleb.addEventListener("click", fecharCelebracao);
      btnCeleb.addEventListener("touchend", function(e) {
        e.preventDefault();
        fecharCelebracao();
      });
      
      document.getElementById("modalCreditos").addEventListener("click", function(e) {
        if (e.target === this) {
          fecharCreditos();
        }
      });
    });
  </script>
</body>
</html>
